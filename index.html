<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cofre: kit de segurança</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="etiqueta">kit de segurança digital</p>
    <h1>Cofre</h1>
    <p class="autoria">Feito por Pedro Henrique Ribeiro Dutra</p>
    <p class="resumo">Ferramentas que rodam no seu navegador.</p>
  </header>

  <main>
    <section aria-labelledby="titulo-vazou">
  <h2 id="titulo-vazou">Verificador de senhas vazadas</h2>

  <p>
    Descubra se uma senha já apareceu em vazamentos de dados.
  </p>

  <label for="vazou-senha">Digite sua senha:</label>
  <input
    type="password"
    id="vazou-senha"
    placeholder="Digite uma senha para verificar"
    autocomplete="off"
  >

  <button type="button" onclick="verificarVazamento()">
    Verificar senha
  </button>

  <p id="vazou-detalhe" aria-live="polite"></p>
  <p id="vazou-resultado" aria-live="polite"></p>
</section>
  </main>

  <footer>
    <p>Cofre · projeto da disciplina Introdução à Ciência da Computação, Prof. Mario Rebello, 2026/2</p>
  </footer>
  <script src="vazou.js"></script>
</body>
</html>
